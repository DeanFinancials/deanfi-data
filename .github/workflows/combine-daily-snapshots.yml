name: Combine Daily Snapshots

on:
  schedule:
    - cron: '00 23 * * 1-5'  # Fallback; deanfi-collectors daily-news.yml dispatches this after pushing catalysts.
  workflow_dispatch:  # Allow manual trigger

# One combine at a time; a manual run queued behind the cron run waits instead of
# racing it for the R2 keys and the commit.
concurrency:
  group: combine-daily-snapshots
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
  R2_BUCKET_NAME: "${{ secrets.R2_BUCKET_NAME }}"
  OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
  MARKET_PULSE_RANKER_MODEL: "${{ vars.MARKET_PULSE_RANKER_MODEL }}"

jobs:
  combine-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout deanfi-data repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install jsonschema openai
      
      - name: Combine daily snapshots
        run: |
          cd dailycombined
          python combine_daily_snapshots.py
          echo "✅ Daily snapshots combined"

      # The catalyst ranker falls back to deterministic order silently; surface what happened.
      - name: Summarize catalyst ranking and input warnings
        if: always()
        continue-on-error: true
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path('dailycombined/market_pulse_input.json')
          if not path.exists():
              print('## Market Pulse input\n\nmarket_pulse_input.json was not written.')
              raise SystemExit(0)
          data = json.loads(path.read_text())
          catalysts = data.get('catalysts') or {}
          outcome = catalysts.get('ranker_outcome') or {}
          print(f"## Market Pulse input: {(data.get('metadata') or {}).get('market_date')}")
          print()
          print(f"- Catalyst ranking method: **{catalysts.get('ranking_method', 'n/a')}**")
          print(f"- Ranker: {outcome.get('status', 'n/a')} (model {outcome.get('model', 'n/a')})"
                + (f" — {outcome['reason']}" if outcome.get('reason') else ''))
          if 'candidates_sent' in outcome:
              print(f"- Candidates sent to ranker: {outcome['candidates_sent']}; stale excluded: {outcome.get('stale_excluded', 0)}")
          print(f"- Stale catalysts demoted: {catalysts.get('stale_demoted_count', 'n/a')}")
          print(f"- Catalyst status: {catalysts.get('status', 'n/a')}")
          for name, module in (data.get('optional_context') or {}).items():
              reason = f" ({module.get('reason')})" if isinstance(module, dict) and module.get('reason') else ''
              print(f"- optional_context.{name}: {(module or {}).get('status', 'n/a')}{reason}")
          for warning in (data.get('validation') or {}).get('warnings') or []:
              print(f"- ⚠️ {warning}")
          PY
          if python3 -c "import json,sys; o=(json.load(open('dailycombined/market_pulse_input.json')).get('catalysts') or {}).get('ranker_outcome') or {}; sys.exit(0 if o.get('status') in (None, 'ai') else 1)" 2>/dev/null; then
            :
          else
            echo "::warning title=Catalyst ranker did not run::Catalysts kept the deterministic order; see the job summary for the reason."
          fi
      
      - name: Verify output file exists
        run: |
          if [ -f dailycombined/market_snapshot.json ]; then
            echo "✅ market_snapshot.json created successfully"
            ls -lh dailycombined/market_snapshot.json
            echo ""
            echo "📊 Summary:"
            python3 -c "import json; data = json.load(open('dailycombined/market_snapshot.json')); print(f\"Categories: {', '.join(data['data'].keys())}\"); print(f\"Total sources: {data['metadata']['total_sources']}\"); print(f\"Generated: {data['metadata']['generated_at']}\")"
          else
            echo "❌ market_snapshot.json not found"
            exit 1
          fi
          
          if [ -f dailycombined/market_pulse_input.json ]; then
            echo "✅ market_pulse_input.json created successfully"
            ls -lh dailycombined/market_pulse_input.json
          else
            echo "❌ market_pulse_input.json not found"
            exit 1
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: '24'
      
      - name: Install Wrangler
        run: npm install -g wrangler@4
      
      - name: Upload market snapshot to R2
        run: |
          echo "📤 Uploading market_snapshot.json to R2 bucket: $R2_BUCKET_NAME"
          
          # Wrangler automatically creates directories as needed when uploading
          # The path "dailycombined/market_snapshot.json" will create the dailycombined directory if it doesn't exist
          if wrangler r2 object put "$R2_BUCKET_NAME/dailycombined/market_snapshot.json" --file="dailycombined/market_snapshot.json" --remote; then
            echo "✅ Successfully uploaded to R2: dailycombined/market_snapshot.json"
            echo "🌐 Available at: https://r2.deanfi.com/dailycombined/market_snapshot.json"
            echo ""
            echo "📊 File Info:"
            ls -lh dailycombined/market_snapshot.json
            FILE_SIZE_KB=$(du -k dailycombined/market_snapshot.json | cut -f1)
            echo "📦 Size: ${FILE_SIZE_KB}KB (uncompressed)"
            echo "📦 Gzipped: ~50-80KB (automatic with CDN)"
            echo "⚡ Perfect size for AI/LLM consumption!"
          else
            echo "❌ Failed to upload to R2"
            exit 1
          fi
      
      - name: Validate Market Pulse input
        run: python dailycombined/validate_market_pulse_input.py dailycombined/market_pulse_input.json
      
      - name: Upload Market Pulse input to R2
        run: |
          echo "📤 Uploading market_pulse_input.json to R2 bucket: $R2_BUCKET_NAME"
          
          if wrangler r2 object put "$R2_BUCKET_NAME/dailycombined/market_pulse_input.json" --file="dailycombined/market_pulse_input.json" --remote; then
            echo "✅ Successfully uploaded to R2: dailycombined/market_pulse_input.json"
            echo "🌐 Available at: https://r2.deanfi.com/dailycombined/market_pulse_input.json"
            echo ""
            echo "📊 File Info:"
            ls -lh dailycombined/market_pulse_input.json
          else
            echo "❌ Failed to upload Market Pulse input to R2"
            exit 1
          fi

          ARCHIVE_MARKET_DATE="$(python3 -c "import json; print(json.load(open('dailycombined/market_pulse_input.json'))['metadata']['market_date'])")"
          if wrangler r2 object put "$R2_BUCKET_NAME/dailycombined/archive/$ARCHIVE_MARKET_DATE/market_pulse_input.json" --file="dailycombined/market_pulse_input.json" --remote; then
            echo "✅ Successfully archived Market Pulse input for $ARCHIVE_MARKET_DATE"
          else
            echo "❌ Failed to archive Market Pulse input for $ARCHIVE_MARKET_DATE"
            exit 1
          fi

      # Start the website's Market Pulse run as soon as its input is in R2, instead of
      # waiting for its fixed cron (which GitHub starts hours late). The website keeps
      # that cron as a fallback and skips dates that already have an article or open PR.
      # Requires secret MARKET_PULSE_DISPATCH_TOKEN: a fine-grained PAT scoped to
      # DeanFinancials/deanfi-website with "Actions: Read and write".
      - name: Trigger Market Pulse generation
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MARKET_PULSE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Market Pulse not dispatched::MARKET_PULSE_DISPATCH_TOKEN is not set; the website's scheduled run will pick up this input."
            exit 0
          fi
          if gh workflow run market-pulse-daily.yml --repo DeanFinancials/deanfi-website --ref main; then
            echo "✅ Dispatched deanfi-website market-pulse-daily.yml" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=Market Pulse dispatch failed::The website's scheduled run remains the fallback."
          fi
      
      - name: Optional - Commit to repository
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f dailycombined/market_snapshot.json ]; then
            echo "No market_snapshot.json to commit"
            exit 0
          fi
          if [ -f dailycombined/market_pulse_input.json ]; then
            git add dailycombined/market_snapshot.json dailycombined/market_pulse_input.json
          else
            git add dailycombined/market_snapshot.json
          fi
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily market snapshot - $(date -u +"%Y-%m-%d %H:%M UTC")"
            if git push origin HEAD:main; then
              echo "✅ Combined snapshot also pushed to repository"
            else
              echo "Initial push failed; rebasing on latest origin/main and retrying..."
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "✅ Combined snapshot pushed after rebase"
              else
                git rebase --abort || true
                {
                  echo "## Snapshot Commit Skipped"
                  echo ""
                  echo "R2 upload completed, but the optional repository commit could not be pushed."
                  echo "Re-run this workflow after checking for a concurrent update to these files."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
