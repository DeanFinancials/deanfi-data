name: Combine Daily Snapshots

on:
  schedule:
    - cron: '00 23 * * 1-5'  # Runs after daily-news catalysts at 22:30 UTC.
  workflow_dispatch:  # Allow manual trigger

env:
  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
  R2_BUCKET_NAME: "${{ secrets.R2_BUCKET_NAME }}"
  OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
  MARKET_PULSE_RANKER_MODEL: "${{ vars.MARKET_PULSE_RANKER_MODEL }}"

jobs:
  combine-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout deanfi-data repo
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: python -m pip install jsonschema openai
      
      - name: Combine daily snapshots
        run: |
          cd dailycombined
          python combine_daily_snapshots.py
          echo "✅ Daily snapshots combined"
      
      - name: Verify output file exists
        run: |
          if [ -f dailycombined/market_snapshot.json ]; then
            echo "✅ market_snapshot.json created successfully"
            ls -lh dailycombined/market_snapshot.json
            echo ""
            echo "📊 Summary:"
            python3 -c "import json; data = json.load(open('dailycombined/market_snapshot.json')); print(f\"Categories: {', '.join(data['data'].keys())}\"); print(f\"Total sources: {data['metadata']['total_sources']}\"); print(f\"Generated: {data['metadata']['generated_at']}\")"
          else
            echo "❌ market_snapshot.json not found"
            exit 1
          fi
          
          if [ -f dailycombined/market_pulse_input.json ]; then
            echo "✅ market_pulse_input.json created successfully"
            ls -lh dailycombined/market_pulse_input.json
          else
            echo "❌ market_pulse_input.json not found"
            exit 1
          fi
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      
      - name: Install Wrangler
        run: npm install -g wrangler
      
      - name: Upload market snapshot to R2
        run: |
          echo "📤 Uploading market_snapshot.json to R2 bucket: $R2_BUCKET_NAME"
          
          # Wrangler automatically creates directories as needed when uploading
          # The path "dailycombined/market_snapshot.json" will create the dailycombined directory if it doesn't exist
          if wrangler r2 object put "$R2_BUCKET_NAME/dailycombined/market_snapshot.json" --file="dailycombined/market_snapshot.json" --remote; then
            echo "✅ Successfully uploaded to R2: dailycombined/market_snapshot.json"
            echo "🌐 Available at: https://r2.deanfi.com/dailycombined/market_snapshot.json"
            echo ""
            echo "📊 File Info:"
            ls -lh dailycombined/market_snapshot.json
            FILE_SIZE_KB=$(du -k dailycombined/market_snapshot.json | cut -f1)
            echo "📦 Size: ${FILE_SIZE_KB}KB (uncompressed)"
            echo "📦 Gzipped: ~50-80KB (automatic with CDN)"
            echo "⚡ Perfect size for AI/LLM consumption!"
          else
            echo "❌ Failed to upload to R2"
            exit 1
          fi
      
      - name: Validate Market Pulse input
        run: python dailycombined/validate_market_pulse_input.py dailycombined/market_pulse_input.json
      
      - name: Upload Market Pulse input to R2
        run: |
          echo "📤 Uploading market_pulse_input.json to R2 bucket: $R2_BUCKET_NAME"
          
          if wrangler r2 object put "$R2_BUCKET_NAME/dailycombined/market_pulse_input.json" --file="dailycombined/market_pulse_input.json" --remote; then
            echo "✅ Successfully uploaded to R2: dailycombined/market_pulse_input.json"
            echo "🌐 Available at: https://r2.deanfi.com/dailycombined/market_pulse_input.json"
            echo ""
            echo "📊 File Info:"
            ls -lh dailycombined/market_pulse_input.json
          else
            echo "❌ Failed to upload Market Pulse input to R2"
            exit 1
          fi
      
      - name: Optional - Commit to repository
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f dailycombined/market_snapshot.json ]; then
            echo "No market_snapshot.json to commit"
            exit 0
          fi
          if [ -f dailycombined/market_pulse_input.json ]; then
            git add dailycombined/market_snapshot.json dailycombined/market_pulse_input.json
          else
            git add dailycombined/market_snapshot.json
          fi
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update daily market snapshot - $(date -u +"%Y-%m-%d %H:%M UTC")"
            if git push origin HEAD:main; then
              echo "✅ Combined snapshot also pushed to repository"
            else
              echo "Initial push failed; rebasing on latest origin/main and retrying..."
              if git pull --rebase origin main && git push origin HEAD:main; then
                echo "✅ Combined snapshot pushed after rebase"
              else
                git rebase --abort || true
                {
                  echo "## Snapshot Commit Skipped"
                  echo ""
                  echo "R2 upload completed, but the optional repository commit could not be pushed."
                  echo "Re-run this workflow after checking for a concurrent update to these files."
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
            fi
          fi
